name: Windows Linux Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to update"
        required: true
        default: "v1.6.8"
      source_ref:
        description: "Source ref to build from"
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: windows-linux-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2025
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify release inputs
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ inputs.release_tag }}" -ne "v$version") { throw "Tag/version mismatch" }

      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install uv==0.10.12
          choco install innosetup --no-progress -y
          "ISCC_PATH=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare optional Authenticode certificate
        id: authenticode
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "ELYAN_REQUIRE_SIGNING=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            return
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "elyan-authenticode.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ELYAN_REQUIRE_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows package
        shell: pwsh
        run: python scripts/build_desktop_installers.py --platform windows --arch x64 --core-only --output release/windows-x64

      - name: Verify checksums and optional Authenticode
        shell: pwsh
        run: |
          Get-ChildItem release/windows-x64/*.sha256 | ForEach-Object {
            $parts = (Get-Content $_.FullName).Trim() -split '\s+', 2
            $artifact = Join-Path $_.DirectoryName $parts[1]
            if ((Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]) {
              throw "Checksum mismatch: $artifact"
            }
          }
          if ("${{ steps.authenticode.outputs.signed }}" -eq "true") {
            Get-ChildItem release/windows-x64 -Include *.exe -File | ForEach-Object {
              if ((Get-AuthenticodeSignature $_.FullName).Status -ne "Valid") {
                throw "Authenticode signature is invalid: $($_.Name)"
              }
            }
          }

      - name: Scan Windows artifacts with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $scanner)) { throw "Microsoft Defender scanner is unavailable" }
          Get-ChildItem release/windows-x64 -Include *.exe,*.zip -File | ForEach-Object {
            & $scanner -Scan -ScanType 3 -File $_.FullName -DisableRemediation
            if ($LASTEXITCODE -ne 0) { throw "Defender rejected $($_.Name) with exit code $LASTEXITCODE" }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-x64
          path: |
            release/windows-x64/*-Setup.exe
            release/windows-x64/*-portable.zip
            release/windows-x64/*.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 packages
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify release inputs
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "${{ inputs.release_tag }}" = "v$VERSION"

      - name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1-dev libgl1 libglib2.0-0 libx11-6 libxext6 libxrender1 libxcb1
          python -m pip install uv==0.10.12
          curl -L --fail --silent --show-error -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Build Linux packages
        shell: bash
        run: python scripts/build_desktop_installers.py --platform linux --arch x64 --output release/linux-x64

      - name: Verify checksums
        shell: bash
        run: |
          cd release/linux-x64
          for checksum in *.sha256; do sha256sum -c "$checksum"; done

      - name: Sign Linux artifacts when GPG key is configured
        shell: bash
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            exit 0
          fi
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          test -n "$FINGERPRINT"
          cd release/linux-x64
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' \) -print0 |
            while IFS= read -r -d '' artifact; do
              gpg --batch --yes --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" --local-user "$FINGERPRINT" --armor --detach-sign "$artifact"
              gpg --verify "$artifact.asc" "$artifact"
            done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: linux-x64
          path: |
            release/linux-x64/*.AppImage
            release/linux-x64/*.deb
            release/linux-x64/*.tar.gz
            release/linux-x64/*.asc
            release/linux-x64/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows and Linux Release assets
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Download platform artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Recheck release checksums
        shell: bash
        run: |
          cd dist
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          cd ..
          python scripts/generate_release_sbom.py --output "dist/Elyan-${RELEASE_TAG#v}-SBOM.cdx.json"
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload release assets
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes "Elyan desktop ${RELEASE_TAG#v}. Windows and Linux packages are refreshed with checksum verification, Defender scanning for Windows, and Linux detached signatures when a release GPG key is configured. macOS notarized assets are published by the macOS signed workflow."
