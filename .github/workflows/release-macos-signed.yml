name: macOS Signed Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to update"
        required: true
        default: "v1.6.8"
      source_ref:
        description: "Source ref to build from"
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: macos-signed-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS arm64 signed and notarized
    runs-on: macos-15
    env:
      ELYAN_REQUIRE_SIGNING: "1"
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify release inputs
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "${{ inputs.release_tag }}" = "v$VERSION"
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/elyan-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          python -c 'import base64,os,pathlib; pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY"
          xcrun notarytool store-credentials "elyan-release" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo "MACOS_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=elyan-release" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12

      - name: Install build tooling
        run: |
          python -m pip install uv==0.10.12
          brew untap aws/tap || true
          brew install portaudio ffmpeg

      - name: Build, notarize, and staple
        run: python scripts/build_desktop_installers.py --platform macos --arch arm64 --output release/macos-arm64

      - name: Verify Gatekeeper and checksums
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/macos-arm64/Elyan.app
          spctl --assess --type execute --verbose=4 release/macos-arm64/Elyan.app
          xcrun stapler validate release/macos-arm64/Elyan.app
          xcrun stapler validate release/macos-arm64/*.dmg
          cd release/macos-arm64
          for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done

      - name: Publish signed macOS assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" release/macos-arm64/*.dmg release/macos-arm64/*.app.zip release/macos-arm64/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes "Elyan desktop ${RELEASE_TAG#v}. macOS arm64 package is signed and notarized; Windows/Linux portable packages are available for testing."
