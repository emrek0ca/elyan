name: Backend V1 Gate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-schema:
    name: build-test-and-schema
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare env
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate generated migrations
        run: npm run db:generate && git diff --exit-code -- drizzle drizzle/meta

      - name: Check release helper scripts
        run: bash -n scripts/probe-v1-runtime-flow.sh scripts/deploy-v1-release.sh

