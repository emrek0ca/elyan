name: Desktop V1 Gate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  runtime-contracts:
    name: runtime-contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements-core.txt pytest reportlab pymupdf python-docx python-pptx sympy pandas matplotlib

      - name: Compile Python sources
        run: python -m compileall runtime actions cli desktop_installer scripts

      - name: Run runtime and installer contracts
        run: >-
          python -m pytest
          tests/test_runtime_startup_contract.py
          tests/test_runtime_bridge_contract.py
          tests/test_executor_core_contract.py
          tests/test_desktop_os_contract.py
          tests/test_desktop_operator_contract.py
          tests/test_installer_bootstrap.py
          tests/test_desktop_installer_builder.py

  release-lock:
    name: release-lock
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install locked uv
        run: python -m pip install uv==0.10.12

      - name: Verify dependency lock is current
        run: |
          cp desktop_installer/requirements-release.lock /tmp/requirements-release.lock
          uv pip compile desktop_installer/requirements-release.in --universal --python-version 3.11 --generate-hashes --output-file desktop_installer/requirements-release.lock
          diff -u /tmp/requirements-release.lock desktop_installer/requirements-release.lock

      - name: Verify SBOM generation
        run: python scripts/generate_release_sbom.py --output /tmp/Elyan-SBOM.cdx.json
