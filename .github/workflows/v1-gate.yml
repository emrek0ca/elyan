name: Desktop V1 Gate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  runtime-contracts:
    name: runtime-contracts
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.10.12
          uv pip install --system -r desktop_installer/requirements-release.lock pytest

      - name: Compile Python sources
        run: python -m compileall runtime actions cli desktop_installer scripts

      - name: Run runtime contracts
        run: >-
          python -m pytest
          tests/test_daemon_cli_contract.py
          tests/test_cross_platform_desktop.py
          tests/test_backend_client_contract.py
          tests/test_desktop_work_order_contract.py
          tests/test_executor_core_contract.py
          tests/test_desktop_os_contract.py
          tests/test_desktop_operator_contract.py
          tests/test_safety_policy_write_gate.py
          tests/test_capability_spec_contract.py
          tests/test_execution_scheduler_contract.py

  installer-contracts:
    name: installer-contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run installer contracts
        run: |
          python -m pip install pytest
          python -m compileall desktop_installer scripts
          python -m pytest tests/test_installer_bootstrap.py tests/test_desktop_installer_builder.py

  release-lock:
    name: release-lock
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install locked uv
        run: python -m pip install uv==0.10.12

      - name: Verify dependency lock is current
        run: |
          cp desktop_installer/requirements-release.lock /tmp/requirements-release.lock
          uv pip compile desktop_installer/requirements-release.in --universal --python-version 3.11 --generate-hashes --output-file desktop_installer/requirements-release.lock
          diff -u /tmp/requirements-release.lock desktop_installer/requirements-release.lock

      - name: Verify SBOM generation
        run: python scripts/generate_release_sbom.py --output /tmp/Elyan-SBOM.cdx.json
