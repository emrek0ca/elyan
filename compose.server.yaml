services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: elyan_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elyan_backend"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis_data:/data

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: "elyan_searxng_internal_secret_do_not_expose"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Internal only — not exposed to internet
    expose:
      - "8080"

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file:
      - .env
    volumes:
      - ./secrets/apple-iap-private-key.p8:/run/secrets/apple-iap-private-key.p8:ro
      - ./secrets/apns-private-key.p8:/run/secrets/apns-private-key.p8:ro
      - blob_data:/app/.blob-store
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DATABASE_APP_URL:-postgres://postgres:postgres@postgres:5432/elyan_backend}
      REDIS_URL: redis://redis:6379
      RELIABILITY_REDIS_REQUIRED: "true"
      RATE_LIMIT_REDIS_ENABLED: "true"
      REALTIME_REDIS_FANOUT_ENABLED: "true"
      REALTIME_REDIS_CHANNEL_PREFIX: elyan:realtime
      REALTIME_EVENT_RETENTION_HOURS: 48
      SSE_MAX_STREAMS_PER_USER: 4
      SSE_REPLAY_LIMIT: 500
      SSE_HEARTBEAT_MS: 15000
      BRAIN_CIRCUIT_FAILURE_THRESHOLD: 3
      BRAIN_CIRCUIT_OPEN_MS: 30000
      TASK_DISPATCH_LOCK_TTL_MS: 120000
      ELYAN_CHAT_QUEUE_ENABLED: "${ELYAN_CHAT_QUEUE_ENABLED:-true}"
      ELYAN_CHAT_WORKER_CONCURRENCY: ${ELYAN_CHAT_WORKER_CONCURRENCY:-4}
      ELYAN_CHAT_PRIMARY_GLOBAL_CONCURRENCY: ${ELYAN_CHAT_PRIMARY_GLOBAL_CONCURRENCY:-6}
      ELYAN_CHAT_FALLBACK_GLOBAL_CONCURRENCY: ${ELYAN_CHAT_FALLBACK_GLOBAL_CONCURRENCY:-4}
      ELYAN_CHAT_GLOBAL_BACKLOG_MAX: ${ELYAN_CHAT_GLOBAL_BACKLOG_MAX:-1000}
      ELYAN_CHAT_USER_BACKLOG_MAX: ${ELYAN_CHAT_USER_BACKLOG_MAX:-3}
      ELYAN_GROQ_RPM_LIMIT: ${ELYAN_GROQ_RPM_LIMIT:-30}
      ELYAN_GROQ_TPM_LIMIT: ${ELYAN_GROQ_TPM_LIMIT:-8000}
      ELYAN_GEMINI_RPM_LIMIT: ${ELYAN_GEMINI_RPM_LIMIT:-10}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_REASONING_MODEL: openai/gpt-oss-120b
      GROQ_FAST_MODEL: openai/gpt-oss-20b
      GROQ_FALLBACK_MODEL: qwen/qwen3.6-27b
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_INTERACTIONS_BASE_URL: ${GEMINI_INTERACTIONS_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.6-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.5-flash-lite}
      GEMINI_REASONING_MODEL: ${GEMINI_REASONING_MODEL:-gemini-3.6-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      GEMINI_IMAGE_PRO_MODEL: ${GEMINI_IMAGE_PRO_MODEL:-gemini-3-pro-image}
      GEMINI_IMAGE_SIZE: ${GEMINI_IMAGE_SIZE:-2K}
      GEMINI_IMAGE_PRO_ENABLED: ${GEMINI_IMAGE_PRO_ENABLED:-true}
      GEMINI_FREE_ONLY: "false"
      GEMINI_PAID_FALLBACK_ENABLED: "${GEMINI_PAID_FALLBACK_ENABLED:-true}"
      GEMINI_PAID_DATA_PROCESSING_ATTESTED: "${GEMINI_PAID_DATA_PROCESSING_ATTESTED:-true}"
      ELYAN_SHARED_BRAIN_PROVIDER: groq
      ELYAN_SHARED_BRAIN_BASE_URL: https://api.groq.com/openai/v1
      ELYAN_SHARED_BRAIN_FALLBACK_PROVIDER: ${ELYAN_SHARED_BRAIN_FALLBACK_PROVIDER:-}
      ELYAN_SHARED_BRAIN_FALLBACK_BASE_URL: ${ELYAN_SHARED_BRAIN_FALLBACK_BASE_URL:-}
      ELYAN_SHARED_BRAIN_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_FAST_MODEL: openai/gpt-oss-20b
      ELYAN_SHARED_BRAIN_BALANCED_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_PLANNING_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_KEEP_ALIVE: 2h
      ELYAN_WORLD_CONTEXT_PACKETS_ENABLED: "true"
      ELYAN_UNDERSTANDING_ENVELOPE_V2_ENABLED: "true"
      ELYAN_SEMANTIC_COMPUTE_WORKER_ENABLED: "true"
      ELYAN_SEMANTIC_TOOL_SELECTION_ENABLED: "true"
      ELYAN_TURN_ENVELOPE_ENABLED: "true"
      ELYAN_DIALOGUE_STATE_ENABLED: "true"
      ELYAN_MEMORY_FABRIC_V2_ENABLED: "true"
      ELYAN_AGENT_LOOP_ENABLED: "true"
      ELYAN_CONNECTOR_TOOLS_ENABLED: "true"
      ELYAN_MCP_SDK_ENABLED: "true"
      ELYAN_MCP_DYNAMIC_TOOLS_ENABLED: "true"
      ELYAN_PROACTIVE_ENGINE_ENABLED: "true"
      ELYAN_MEMORY_WORKER_DISABLED: "true"
      ELYAN_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  training-worker:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_APP_URL:-postgres://postgres:postgres@postgres:5432/elyan_backend}
      REDIS_URL: redis://redis:6379
      RELIABILITY_REDIS_REQUIRED: "true"
      RATE_LIMIT_REDIS_ENABLED: "true"
      REALTIME_REDIS_FANOUT_ENABLED: "true"
      REALTIME_REDIS_CHANNEL_PREFIX: elyan:realtime
      REALTIME_EVENT_RETENTION_HOURS: 48
      SSE_MAX_STREAMS_PER_USER: 4
      SSE_REPLAY_LIMIT: 500
      SSE_HEARTBEAT_MS: 15000
      BRAIN_CIRCUIT_FAILURE_THRESHOLD: 3
      BRAIN_CIRCUIT_OPEN_MS: 30000
      TASK_DISPATCH_LOCK_TTL_MS: 120000
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_REASONING_MODEL: openai/gpt-oss-120b
      GROQ_FAST_MODEL: openai/gpt-oss-20b
      GROQ_FALLBACK_MODEL: qwen/qwen3.6-27b
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_INTERACTIONS_BASE_URL: ${GEMINI_INTERACTIONS_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.6-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.5-flash-lite}
      GEMINI_REASONING_MODEL: ${GEMINI_REASONING_MODEL:-gemini-3.6-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      GEMINI_IMAGE_PRO_MODEL: ${GEMINI_IMAGE_PRO_MODEL:-gemini-3-pro-image}
      GEMINI_IMAGE_SIZE: ${GEMINI_IMAGE_SIZE:-2K}
      GEMINI_IMAGE_PRO_ENABLED: ${GEMINI_IMAGE_PRO_ENABLED:-true}
      ELYAN_SHARED_BRAIN_PROVIDER: groq
      ELYAN_SHARED_BRAIN_BASE_URL: https://api.groq.com/openai/v1
      ELYAN_SHARED_BRAIN_FALLBACK_PROVIDER: ${ELYAN_SHARED_BRAIN_FALLBACK_PROVIDER:-}
      ELYAN_SHARED_BRAIN_FALLBACK_BASE_URL: ${ELYAN_SHARED_BRAIN_FALLBACK_BASE_URL:-}
      ELYAN_SHARED_BRAIN_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_FAST_MODEL: openai/gpt-oss-20b
      ELYAN_SHARED_BRAIN_BALANCED_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_PLANNING_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_KEEP_ALIVE: 2h
      ELYAN_WORLD_CONTEXT_PACKETS_ENABLED: "true"
      NODE_TRAINING_WORKER_ENABLED: "false"
    command: ["sh", "-lc", "echo 'node training worker disabled; ml-worker owns training job execution'; sleep infinity"]

  brain-worker:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_WORKER_URL:-postgres://postgres:postgres@postgres:5432/elyan_backend}
      REDIS_URL: redis://redis:6379
      RELIABILITY_REDIS_REQUIRED: "true"
      ELYAN_MEMORY_WORKER_DISABLED: "true"
      ELYAN_PROACTIVE_ENGINE_ENABLED: "false"
    command: ["node", "dist/workers/brain-worker.js"]

  chat-worker:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file:
      - .env
    volumes:
      - blob_data:/app/.blob-store
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_WORKER_URL:-postgres://postgres:postgres@postgres:5432/elyan_backend}
      REDIS_URL: redis://redis:6379
      RELIABILITY_REDIS_REQUIRED: "true"
      REALTIME_REDIS_FANOUT_ENABLED: "true"
      REALTIME_REDIS_CHANNEL_PREFIX: elyan:realtime
      ELYAN_CHAT_QUEUE_ENABLED: "${ELYAN_CHAT_QUEUE_ENABLED:-true}"
      ELYAN_CHAT_WORKER_REPLICAS: ${ELYAN_CHAT_WORKER_REPLICAS:-2}
      ELYAN_CHAT_WORKER_CONCURRENCY: ${ELYAN_CHAT_WORKER_CONCURRENCY:-4}
      ELYAN_CHAT_PRIMARY_GLOBAL_CONCURRENCY: ${ELYAN_CHAT_PRIMARY_GLOBAL_CONCURRENCY:-6}
      ELYAN_CHAT_FALLBACK_GLOBAL_CONCURRENCY: ${ELYAN_CHAT_FALLBACK_GLOBAL_CONCURRENCY:-4}
      ELYAN_CHAT_GLOBAL_BACKLOG_MAX: ${ELYAN_CHAT_GLOBAL_BACKLOG_MAX:-1000}
      ELYAN_CHAT_USER_BACKLOG_MAX: ${ELYAN_CHAT_USER_BACKLOG_MAX:-3}
      ELYAN_GROQ_RPM_LIMIT: ${ELYAN_GROQ_RPM_LIMIT:-30}
      ELYAN_GROQ_TPM_LIMIT: ${ELYAN_GROQ_TPM_LIMIT:-8000}
      ELYAN_GEMINI_RPM_LIMIT: ${ELYAN_GEMINI_RPM_LIMIT:-10}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_REASONING_MODEL: openai/gpt-oss-120b
      GROQ_FAST_MODEL: openai/gpt-oss-20b
      GROQ_FALLBACK_MODEL: qwen/qwen3.6-27b
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_INTERACTIONS_BASE_URL: ${GEMINI_INTERACTIONS_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.6-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.5-flash-lite}
      GEMINI_REASONING_MODEL: ${GEMINI_REASONING_MODEL:-gemini-3.6-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      GEMINI_FREE_ONLY: "false"
      GEMINI_PAID_FALLBACK_ENABLED: "${GEMINI_PAID_FALLBACK_ENABLED:-true}"
      GEMINI_PAID_DATA_PROCESSING_ATTESTED: "${GEMINI_PAID_DATA_PROCESSING_ATTESTED:-true}"
      ELYAN_SHARED_BRAIN_PROVIDER: groq
      ELYAN_SHARED_BRAIN_BASE_URL: https://api.groq.com/openai/v1
      ELYAN_SHARED_BRAIN_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_FAST_MODEL: openai/gpt-oss-20b
      ELYAN_SHARED_BRAIN_BALANCED_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_PLANNING_MODEL: openai/gpt-oss-120b
      ELYAN_SHARED_BRAIN_KEEP_ALIVE: 2h
      ELYAN_WORLD_CONTEXT_PACKETS_ENABLED: "true"
      ELYAN_UNDERSTANDING_ENVELOPE_V2_ENABLED: "true"
      ELYAN_SEMANTIC_COMPUTE_WORKER_ENABLED: "true"
      ELYAN_SEMANTIC_TOOL_SELECTION_ENABLED: "true"
      ELYAN_TURN_ENVELOPE_ENABLED: "true"
      ELYAN_DIALOGUE_STATE_ENABLED: "true"
      ELYAN_MEMORY_FABRIC_V2_ENABLED: "true"
      ELYAN_AGENT_LOOP_ENABLED: "true"
      ELYAN_CONNECTOR_TOOLS_ENABLED: "true"
      ELYAN_MCP_SDK_ENABLED: "true"
      ELYAN_MCP_DYNAMIC_TOOLS_ENABLED: "true"
      ELYAN_PROACTIVE_ENGINE_ENABLED: "false"
      ELYAN_MEMORY_WORKER_DISABLED: "true"
      ELYAN_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
    command: ["node", "dist/workers/chat-worker.js"]
    deploy:
      replicas: ${ELYAN_CHAT_WORKER_REPLICAS:-2}

  document-worker:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_WORKER_URL:-postgres://postgres:postgres@postgres:5432/elyan_backend}
      REDIS_URL: redis://redis:6379
      RELIABILITY_REDIS_REQUIRED: "true"
      ELYAN_MEMORY_WORKER_DISABLED: "true"
    command: ["node", "dist/workers/document-worker.js"]

  proactive-scheduler:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_WORKER_URL:-postgres://postgres:postgres@postgres:5432/elyan_backend}
      REDIS_URL: redis://redis:6379
      RELIABILITY_REDIS_REQUIRED: "true"
      ELYAN_MEMORY_WORKER_DISABLED: "true"
      ELYAN_PROACTIVE_ENGINE_ENABLED: "true"
      # Night watch and the observer default to off and are turned on from
      # .env once push delivery has been verified end to end. Speaking
      # unprompted before the delivery channel is proven would mean the user
      # never sees what Elyan did.
      ELYAN_NIGHT_WATCH_ENABLED: ${ELYAN_NIGHT_WATCH_ENABLED:-false}
      ELYAN_PROACTIVE_OBSERVER_ENABLED: ${ELYAN_PROACTIVE_OBSERVER_ENABLED:-false}
    command: ["node", "dist/workers/proactive-scheduler.js"]

  ml-worker:
    build:
      context: ./ml-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_APP_URL:-postgres://postgres:postgres@postgres:5432/elyan_backend}
      ML_WORKER_HEARTBEAT_SECONDS: 15
      ML_WORKER_MODE: runner
      ML_WORKER_POLL_SECONDS: 5
      ML_WORKER_JOB_TIMEOUT_SECONDS: 300
      ML_WORKER_MAX_BATCH: 1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); raise SystemExit(0 if r.ping() else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  blob_data:
