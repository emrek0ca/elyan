<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*;"
    />
    <title>Elyan</title>
    <script>
      try {
        var theme = localStorage.getItem('elyan-theme') || 'elyan';
        if (theme !== 'elyan') {
          document.documentElement.setAttribute('data-theme', theme);
        }
        var scale = localStorage.getItem('elyan-ui-scale');
        if (scale) {
          document.documentElement.style.zoom = scale;
        }
        var ambient = localStorage.getItem('elyan-ambient-opacity');
        if (ambient !== null) {
          document.documentElement.style.setProperty('--ambient-opacity', ambient);
        }
        var radius = localStorage.getItem('elyan-base-radius');
        if (radius !== null) {
          document.documentElement.style.setProperty('--base-radius', radius);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
